# Application service web port
server:
  port: 8090
spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  # SQL initialization configuration
  sql:
    init:
      mode: always  # Change to "never" to avoid re-initializing on every startup
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      encoding: UTF-8
      continue-on-error: false
  # Database configuration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/flower_market?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
# File upload configuration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
      enabled: true

# Custom file upload path configuration
file:
  upload:
    path: ./uploads/images/

# MyBatis-Plus configuration
mybatis-plus:
  configuration:
    # SQL log output
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # Enable camel-case mapping: DB field create_date -> Java field createDate
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # Primary key strategy
      id-type: auto

knife4j:
  enable: true
  basic:
    enable: false
    username:
    password:
  production: false # Set to true in production