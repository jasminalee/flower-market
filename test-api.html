<!DOCTYPE html>
<html>
<head>
    <title>测试API接口</title>
    <meta charset="UTF-8">
</head>
<body>
    <h1>测试分类接口</h1>
    <button onclick="testApi()">测试 GET /api/admin/categories</button>
    <pre id="result"></pre>

    <script>
        async function testApi() {
            try {
                const response = await fetch('http://localhost:18091/api/admin/categories');
                const data = await response.json();
                document.getElementById('result').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('result').textContent = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
